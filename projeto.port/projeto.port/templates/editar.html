
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar produto | StockPro</title>

    <link rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>📦 StockPro</h1>
        <p>Editar produto</p>
    </header>

    <main>
        <h2>{{ produto["Nome"] }}</h2>

        {% with mensagens = get_flashed_messages() %}
            {% for mensagem in mensagens %}
                <p class="mensagem">{{ mensagem }}</p>
            {% endfor %}
        {% endwith %}

        <form method="POST">
            <label for="nome">Nome do produto</label>
            <input id="nome" name="nome" type="text"
                value="{{ produto['Nome'] }}" required>

            <label for="preco">Preço (R$)</label>
            <input id="preco" name="preco" type="number"
                min="0.01" step="0.01"
                value="{{ produto['Preço'] }}" required>

            <label for="quantidade">Quantidade</label>
            <input id="quantidade" name="quantidade" type="number"
                min="0" step="1"
                value="{{ produto['Quantidade'] }}" required>

            <button type="submit">Salvar alterações</button>
        </form>

        <p><a href="{{ url_for('inicio') }}">Voltar ao estoque</a></p>
    </main>
</body>
</html>
