<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ativar conta | StockPro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='home.css') }}">
</head>
<body>
    <header><h1>Stock<span>Pro</span></h1><p>Configure a senha da sua conta existente</p></header>
    <main>
        <section>
            <h2>Ativar conta antiga</h2>
            <p>Informe o CNPJ e o contato já cadastrados para definir uma senha.</p>
            {% with mensagens = get_flashed_messages() %}
                {% for mensagem in mensagens %}<p class="mensagem">{{ mensagem }}</p>{% endfor %}
            {% endwith %}
            <form method="POST">
                <label for="cnpj">CNPJ cadastrado</label>
                <input id="cnpj" name="cnpj" required>
                <label for="contato">Contato cadastrado</label>
                <input id="contato" name="contato" required>
                <label for="senha">Nova senha (mínimo 8 caracteres)</label>
                <input id="senha" name="senha" type="password" minlength="8" autocomplete="new-password" required>
                <label for="confirmar_senha">Confirmar senha</label>
                <input id="confirmar_senha" name="confirmar_senha" type="password" minlength="8" autocomplete="new-password" required>
                <button type="submit">Criar senha</button>
            </form>
            <p><a href="{{ url_for('login') }}">Voltar ao login</a></p>
        </section>
    </main>
</body>
</html>
